[mypy]
python_version = 3.9
ignore_missing_imports = True
# The blocking CI pass lists specific files; only report errors in those,
# not in legacy modules they happen to import (those are covered by the
# separate non-blocking full-package pass).
follow_imports = silent
# Lenient globally — the legacy modules aren't fully annotated yet, so we
# don't fail on untyped defs. The CI "blocking" mypy pass targets only the
# curated, fully-typed modules (see .github/workflows/ci.yml); the rest are
# checked non-blocking so issues surface without gating the build. As more
# modules are annotated, add them to the blocking set.
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True

[mypy-tests.*]
ignore_errors = True
